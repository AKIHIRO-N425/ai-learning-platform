<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業管理画面 | AI学習プラットフォーム</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      color: #0f172a;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    #message {
      color: #64748b;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1>企業管理画面</h1>
      <p id="companyName">企業情報を読み込み中...</p>
    </div>

    <button onclick="logout()">ログアウト</button>
  </div>

  <div class="card">
    <h2>受講者一覧</h2>
    <p>自社に所属する受講者を確認できます。</p>

    <div id="message">読み込み中...</div>

    <table id="studentTable" style="display:none;">
      <thead>
        <tr>
          <th>受講者名</th>
          <th>権限</th>
          <th>企業ID</th>
          <th>進捗</th>
        </tr>
      </thead>

      <tbody id="studentList"></tbody>
    </table>
  </div>
<script>
  const supabaseUrl = "https://xjwmgvvoxunsqdjttpdo.supabase.co";
  const supabaseKey = "sb_publishable_VOQIwc0dAsPP233GHl9Cog_Kle9Ybfd";

  const supabaseClient =
    supabase.createClient(supabaseUrl, supabaseKey);

  async function loadCompanyAdmin() {

    // 現在ログインしているユーザーを取得
    const { data: { user } } =
      await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "index.html";
      return;
    }

    // ログインユーザーの権限・企業IDを取得
    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("role, company_id, name")
        .eq("user_id", user.id)
        .single();

    if (
      profileError ||
      !profile ||
      profile.role !== "company_admin" ||
      !profile.company_id
    ) {
      alert("企業管理者のみアクセスできます");
      window.location.href = "index.html";
      return;
    }

    // 企業情報を取得
    const { data: company } =
      await supabaseClient
        .from("companies")
        .select("company_name, company_code")
        .eq("company_code", profile.company_id)
        .single();

    document.getElementById("companyName").textContent =
      company
        ? company.company_name + " 管理者画面"
        : "企業管理者画面";

    // 同じ企業の受講者だけ取得
    const { data: students, error: studentError } =
      await supabaseClient
        .from("profiles")
        .select("user_id, name, role, company_id")
        .eq("company_id", profile.company_id)
        .eq("role", "student")
        .order("name");

    if (studentError) {
      console.error(studentError);
      document.getElementById("message").textContent =
        "受講者情報の取得に失敗しました";
      return;
    }

    const studentList =
      document.getElementById("studentList");

    studentList.innerHTML = "";

    students.forEach(student => {
  const row = document.createElement("tr");

  row.innerHTML = `
    <td>${student.name || "名前未設定"}</td>
    <td>受講者</td>
    <td>${student.company_id}</td>
    <td><button type="button" onclick="viewStudent('${student.user_id}')">進捗を見る</button></td>
  `;

  studentList.appendChild(row);
});

    document.getElementById("message").textContent =
      `受講者数：${students.length}人`;

    document.getElementById("studentTable").style.display =
      students.length > 0 ? "table" : "none";
    
  }
async function viewStudent(userId) {
  const { data: progress, error: progressError } = await supabaseClient
    .from("learning_progress")
    .select("*")
    .eq("user_id", userId);

  const { data: testResults, error: testError } = await supabaseClient
    .from("test_results")
    .select("*")
    .eq("user_id", userId);

  if (progressError || testError) {
    console.error(progressError || testError);
    alert("進捗情報の取得に失敗しました");
    return;
  }

  console.log("学習進捗:", progress);
  console.log("テスト結果:", testResults);

  const completedCount = progress.filter(item => item.completed).length;

const averageScore =
  testResults.length > 0
    ? Math.round(
        testResults.reduce((sum, item) => sum + Number(item.score || 0), 0) /
        testResults.length
      )
    : 0;
const testResultsHtml = testResults.length > 0
  ? testResults.map(item => {
      const percent = item.total_questions > 0
        ? Math.round((Number(item.score) / Number(item.total_questions)) * 100)
        : 0;

      return `
        <li>
          第${Number(String(item.course_id).replace("course", ""))}コース 第${Number(item.lesson_index) + 1}回
          ｜${item.score}/${item.total_questions}点
          ｜${percent}%
          ｜${item.passed ? "合格" : "不合格"}
        </li>
      `;
    }).join("")
  : "<li>テスト結果はありません</li>";
const progressHtml = progress.length > 0
  ? progress.map(item => `
      <li>
       ${item.course_id === "basic_ai"
  ? "第1コース"
  : `第${Number(String(item.course_id).replace("course", ""))}コース`}
第${Number(String(item.lesson_id).replace("lesson", ""))}回
        ${item.completed ? "：完了" : "：未完了"}
      </li>
    `).join("")
  : "<li>学習履歴はありません</li>";

const detail = document.createElement("div");
detail.style.marginTop = "20px";
detail.style.padding = "20px";
detail.style.background = "#f8fafc";
detail.style.borderRadius = "10px";

detail.innerHTML = `
  <h3>受講者の学習状況</h3>
  <p>完了レッスン：${completedCount}件</p>
  <p>テスト実施回数：${testResults.length}回</p>
  <p>平均スコア：${testResults.length > 0 ? averageScore : "-"}</p>
 <h4>学習状況（動画視聴）</h4>
<ul>
  ${progressHtml}
</ul>

<h4>テスト結果</h4>
<ul>
  ${testResultsHtml}
</ul>
`;

const oldDetail = document.getElementById("studentDetail");
if (oldDetail) oldDetail.remove();

detail.id = "studentDetail";
document.querySelector(".card").appendChild(detail);
}
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }

  loadCompanyAdmin();
</script>

</body>
</html>
