<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI学習プラットフォーム</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  body {
    margin: 0;
    font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f4f7fb;
    color: #1f2937;
  }

  body > h1,
  body > h2,
  body > input,
  body > button,
  body > p,
  body > br {
    margin-left: 0;
  }

  body {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 30px;
    color: #0f172a;
  }

  h2 {
    font-size: 22px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    max-width: 360px;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    background: white;
  }

  button {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    margin-top: 8px;
    margin-right: 8px;
  }

  button:hover {
    background: #1d4ed8;
  }

  button:disabled {
    background: #cbd5e1;
    cursor: default;
  }

  h3 {

    margin-bottom: 8px;
    font-size: 20px;
  }

  p {
    line-height: 1.7;
  }
</style>
</head>

<body>

  <h1>AI学習プラットフォーム</h1>

  <h2>ログイン</h2>

  <input
    type="email"
    id="email"
    placeholder="メールアドレス"
  >

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="パスワード"
  >

  <br><br>

  <button onclick="login()">ログイン</button>

  <p id="message"></p>

  <script>
    const supabaseUrl = "https://xjwmgvvoxunsqdjttpdo.supabase.co";
    const supabaseKey = "sb_publishable_VOQIwc0dAsPP233GHl9Cog_Kle9Ybfd";

    const supabaseClient =
      supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        document.getElementById("message").innerText =
          "ログイン失敗：" + error.message;
     } else {
  document.body.innerHTML = `
    <h1>AI学習プラットフォーム</h1>
    <h2>学習メニュー</h2>

    <h3>① 生成AIの基礎</h3>
    <p>生成AIとは何か、基本から学びます。</p>
   <button onclick="showBasicAI()">学習する</button>

    <h3>② プロンプトの基本</h3>
    <p>ChatGPTへの上手な指示の出し方を学びます。</p>
    <button>学習する</button>

    <h3>③ ChatGPTの業務活用</h3>
    <p>仕事でChatGPTを活用する方法を学びます。</p>
    <button>学習する</button>
  `;
}
    }
    function showBasicAI() {
  document.body.innerHTML = `
    <h1>① 生成AIの基礎</h1>
<p id="progressText">進捗を読み込み中...</p>
    <h3>第1回　生成AIとは？</h3>
    <p>生成AIの基本を学びます。</p>
    <button onclick="window.open('https://www.youtube.com/', '_blank')">動画を見る</button>
<button onclick="completeLesson('lesson1')">第1回を学習完了にする</button>
    <h3>第2回　ChatGPTとは？</h3>
    <p>ChatGPTの特徴を学びます。</p>
    <button>動画を見る</button>
<button onclick="completeLesson('lesson2')">第2回を学習完了にする</button>
    <h3>第3回　生成AIでできること</h3>
    <p>仕事での活用例を学びます。</p>
    <button>動画を見る</button>
<button onclick="completeLesson('lesson3')">第3回を学習完了にする</button>
    <br><br>
    <button onclick="location.reload()">学習メニューに戻る</button>
  `;
  showCompletedLessons();
}

async function completeLesson(lessonId) {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert('ログインしてください');
    return;
  }

  const { error } = await supabaseClient
    .from('learning_progress')
    .upsert({
  user_id: user.id,
  course_id: 'basic_ai',
  lesson_id: lessonId,
  completed: true,
  completed_at: new Date().toISOString()
}, {
  onConflict: 'user_id,course_id,lesson_id'
});

  if (error) {
    console.error(error);
    alert('学習記録の保存に失敗しました');
  } else {
    alert('学習完了を記録しました！');
  await showCompletedLessons();
  }
}
async function showCompletedLessons() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) return;

  const { data, error } = await supabaseClient
    .from('learning_progress')
.select('lesson_id')
.eq('user_id', user.id)
.eq('course_id', 'basic_ai')
.eq('completed', true);

  if (error) {
    console.error(error);
    return;
  }

  data.forEach(item => {
    const button = document.querySelector(
      `button[onclick="completeLesson('${item.lesson_id}')"]`
    );

    if (button) {
      button.innerText = '✅ 完了済み';
      button.disabled = true;
    }
  });
  const progressText = document.getElementById('progressText');
if (progressText) {
  const completedCount = data.length;
  const totalLessons = 3;
  const percent = Math.round((completedCount / totalLessons) * 100);

  progressText.innerText =
    `学習進捗：${completedCount} / ${totalLessons} 完了（${percent}%）`;
}
}
showCompletedLessons();
    async function checkLoginStatus() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (user) {
    showMenu();
  }
}

checkLoginStatus();
</script>

</body>
</html>
