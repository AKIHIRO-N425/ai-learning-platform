<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI学習プラットフォーム</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>AI学習プラットフォーム</h1>

  <h2>ログイン</h2>

  <input
    type="email"
    id="email"
    placeholder="メールアドレス"
  >

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="パスワード"
  >

  <br><br>

  <button onclick="login()">ログイン</button>

  <p id="message"></p>

  <script>
    const supabaseUrl = "https://xjwmgvvoxunsqdjttpdo.supabase.co";
    const supabaseKey = "sb_publishable_VOQIwc0dAsPP233GHl9Cog_Kle9Ybfd";

    const supabaseClient =
      supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        document.getElementById("message").innerText =
          "ログイン失敗：" + error.message;
     } else {
  document.body.innerHTML = `
    <h1>AI学習プラットフォーム</h1>
    <h2>学習メニュー</h2>

    <h3>① 生成AIの基礎</h3>
    <p>生成AIとは何か、基本から学びます。</p>
   <button onclick="showBasicAI()">学習する</button>

    <h3>② プロンプトの基本</h3>
    <p>ChatGPTへの上手な指示の出し方を学びます。</p>
    <button>学習する</button>

    <h3>③ ChatGPTの業務活用</h3>
    <p>仕事でChatGPTを活用する方法を学びます。</p>
    <button>学習する</button>
  `;
}
    }
    function showBasicAI() {
  document.body.innerHTML = `
    <h1>① 生成AIの基礎</h1>

    <h3>第1回　生成AIとは？</h3>
    <p>生成AIの基本を学びます。</p>
    <button>動画を見る</button>

    <h3>第2回　ChatGPTとは？</h3>
    <p>ChatGPTの特徴を学びます。</p>
    <button>動画を見る</button>

    <h3>第3回　生成AIでできること</h3>
    <p>仕事での活用例を学びます。</p>
    <button>動画を見る</button>

    <br><br>
    <button onclick="location.reload()">学習メニューに戻る</button>
  `;
}
  </script>

</body>
</html>
