  const lessonsHtml = course.lessons.map((lessonTitle, index) => {
    const lessonId = `lesson${index + 1}`;

    return `

        <h3>第${index + 1}回　${lessonTitle}</h3>
        <button

async function completeLesson(lessonId, courseId = 'basic_ai') {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert('ログインしてください');
    return;
  }

  const { error } = await supabaseClient
    .from('learning_progress')
    .upsert({
  user_id: user.id,
 course_id: courseId,
  lesson_id: lessonId,
  completed: true,
  completed_at: new Date().toISOString()
}, {
  onConflict: 'user_id,course_id,lesson_id'
});

  if (error) {
    console.error(error);
    alert('学習記録の保存に失敗しました');
  } else {
    alert('学習完了を記録しました！');
  await showCompletedLessons(courseId);
  }
}
async function showCompletedLessons(courseId = 'basic_ai') {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) return;

  const { data, error } = await supabaseClient
    .from('learning_progress')
.select('lesson_id')
.eq('user_id', user.id)
.eq('course_id', courseId)
.eq('completed', true);

  if (error) {
    console.error(error);
    return;
  }

  data.forEach(item => {
    const button = document.querySelector(
  `button[data-lesson-id="${item.lesson_id}"]`
);

    if (button) {
      button.innerText = '✅ 完了済み';
      button.disabled = true;
    }
  });
  const progressText = document.getElementById('progressText');
if (progressText) {
  const completedCount = data.length;
const totalLessons = courses[courseId]?.lessons.length || 0;
const percent = Math.round((completedCount / totalLessons) * 100);
  progressText.innerText =
    `学習進捗：${completedCount} / ${totalLessons} 完了（${percent}%）`;
}
}
