<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI学習プラットフォーム</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>AI学習プラットフォーム</h1>

  <h2>ログイン</h2>

  <input
    type="email"
    id="email"
    placeholder="メールアドレス"
  >

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="パスワード"
  >

  <br><br>

  <button onclick="login()">ログイン</button>

  <p id="message"></p>

  <script>
    const supabaseUrl = "https://xjwmgvvoxunsqdjttpdo.supabase.co";
    const supabaseKey = "sb_publishable_VOQIwc0dAsPP233GHl9Cog_Kle9Ybfd";

    const supabaseClient =
      supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        document.getElementById("message").innerText =
          "ログイン失敗：" + error.message;
      } else {
        document.getElementById("message").innerText =
          "ログイン成功！";
      }
    }
  </script>

</body>
</html>
