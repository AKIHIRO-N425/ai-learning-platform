    async function updateOverallProgress() {
  const learningEl = document.getElementById("overallLearningProgress");
  const testEl = document.getElementById("overallTestProgress");

  if (!learningEl || !testEl) return;

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    learningEl.textContent = "ログインすると進捗が表示されます";
    testEl.textContent = "";
    return;
  }

  const totalLessons = Object.values(courses)
    .reduce((sum, course) => sum + course.lessons.length, 0);

  const { data, error } = await supabaseClient
    .from("learning_progress")
    .select("course_id, lesson_id")
    .eq("user_id", user.id)
    .eq("completed", true);

  if (error) {
    console.error(error);
    learningEl.textContent = "学習進捗を取得できませんでした";
    return;
  }

  const completedLessons = data ? data.length : 0;
  const learningPercent = totalLessons
    ? Math.round((completedLessons / totalLessons) * 100)
    : 0;

  let passedTests = 0;

  Object.entries(courses).forEach(([courseId, course]) => {
    course.lessons.forEach((lesson, index) => {
      if (localStorage.getItem(`testPassed_${courseId}_${index}`) === "true") {
        passedTests++;
      }
    });
  });

  const testPercent = totalLessons
    ? Math.round((passedTests / totalLessons) * 100)
    : 0;

  learningEl.textContent =
    `📚 全体の学習進捗：${completedLessons} / ${totalLessons} 完了（${learningPercent}%）`;

  testEl.textContent =
    `✅ 理解度テスト：${passedTests} / ${totalLessons} 合格（${testPercent}%）`;
}

function showTest(courseId, lessonIndex) {
  const courseTests = lessonTests[courseId];

  if (!courseTests || !courseTests[lessonIndex]) {
    alert("この教材のテストはまだ準備されていません。");
    return;
  }

  const test = courseTests[lessonIndex];

  const questionsHtml = test.questions.map((question, qIndex) => {
    const choicesHtml = question.choices.map((choice, cIndex) => `
      <label style="display:block; margin:10px 0;">
        <input
          type="radio"
          name="q${qIndex}"
          value="${cIndex}"
        >
        ${choice}
      </label>
    `).join("");

    return `
      <div class="dashboard-card">
        <h3>第${qIndex + 1}問</h3>
        <p>${question.text}</p>
        ${choicesHtml}
      </div>
    `;
  }).join("");

  document.body.innerHTML = `
    <div class="main-content">
      <h1>${test.title}　理解度テスト</h1>
      <p>3問・70%以上で合格</p>

      ${questionsHtml}

      <button onclick="checkLessonTest('${courseId}', ${lessonIndex})">
        採点する
      </button>

      <p id="testResult"></p>

      <br>
      <button onclick="showCourse('${courseId}')">
        教材一覧に戻る
      </button>
    </div>
  `;
}

function checkLessonTest(courseId, lessonIndex) {
  const test = lessonTests[courseId][lessonIndex];
  let score = 0;

  for (let i = 0; i < test.questions.length; i++) {
    const selected =
      document.querySelector(`input[name="q${i}"]:checked`);

    if (!selected) {
      document.getElementById("testResult").textContent =
        "すべての問題に回答してください。";
      return;
    }

    if (Number(selected.value) === test.questions[i].answer) {
      score++;
    }
  }

  const percent =
    Math.round((score / test.questions.length) * 100);

  const passed = percent >= 70;
if (passed) {
  localStorage.setItem(`testPassed_${courseId}_${lessonIndex}`, "true");
}
  document.getElementById("testResult").innerHTML =
    passed
      ? `✅ 合格です！ ${score} / ${test.questions.length}問正解（${percent}%）`
      : `❌ 不合格です。${score} / ${test.questions.length}問正解（${percent}%）<br>もう一度復習して挑戦しましょう。`;
}

async function completeLesson(lessonId, courseId = 'basic_ai') {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert('ログインしてください');
    return;
  }

  const { error } = await supabaseClient
    .from('learning_progress')
    .upsert({
  user_id: user.id,
 course_id: courseId,
  lesson_id: lessonId,
  completed: true,
  completed_at: new Date().toISOString()
}, {
  onConflict: 'user_id,course_id,lesson_id'
});

  if (error) {
    console.error(error);
    alert('学習記録の保存に失敗しました');
  } else {
    alert('学習完了を記録しました！');
  await showCompletedLessons(courseId);
  }
}
async function showCompletedLessons(courseId = 'basic_ai') {
  const course = courses[courseId];
if (!course) return;
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) return;

  const { data, error } = await supabaseClient
    .from('learning_progress')
.select('lesson_id')
.eq('user_id', user.id)
.eq('course_id', courseId)
.eq('completed', true);

  if (error) {
    console.error(error);
    return;
  }
course.lessons.forEach((lessonTitle, index) => {
  const lessonId = `lesson${index + 1}`;
  const passed = localStorage.getItem(
    `testPassed_${courseId}_${index}`
  ) === "true";

  const status = document.querySelector(
    `[data-test-status="${lessonId}"]`
  );

  if (status && passed) {
    status.textContent = "✅ テスト合格済み";
  }
});
  data.forEach(item => {
    const button = document.querySelector(
  `button[data-lesson-id="${item.lesson_id}"]`
);

    if (button) {
      button.innerText = '✅ 完了済み';
      button.disabled = true;
    }
  });
  const progressText = document.getElementById('progressText');
if (progressText) {
  const completedCount = data.length;
const totalLessons = courses[courseId]?.lessons.length || 0;
const percent = Math.round((completedCount / totalLessons) * 100);
  progressText.innerText =
    `学習進捗：${completedCount} / ${totalLessons} 完了（${percent}%）`;
}
}
