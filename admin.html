<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習進捗 管理画面</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  body {
    margin: 0;
    font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f4f7fb;
    color: #1f2937;
    
  }

  h1 {
    font-size: 32px;
    margin-bottom: 28px;
    color: #0f172a;
  }

  table {
    width: 100%;
   
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
  }

  th,
  td {
    padding: 16px 18px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
  }

  th {
    background: #2563eb;
    color: white;
    font-weight: bold;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover td {
    background: #f8fafc;
  }
</style>
</head>

<body>
<div style="display:flex; min-height:100vh;">

 <aside style="width:240px; background:#fff; border-right:1px solid #e5e7eb; padding:24px; box-sizing:border-box; min-height:100vh;">
    <img src="logo.png" alt="NODAICHI" style="width:170px; margin-bottom:8px;">
    <p style="color:#777; margin-top:0;">管理画面</p>

    <div style="margin-top:30px; line-height:2.6;">
      <div>📊 ダッシュボード</div>
      <div>👤 ユーザー管理</div>
      <div>📚 コンテンツ管理</div>
      <div>📝 テスト管理</div>
      <div>📈 進捗管理</div>
      <div>📰 ニュース管理</div>
      <div>📢 お知らせ管理</div>
      <div>💬 コメント管理</div>
      <div>🔔 通知管理</div>
    </div>

    <div style="margin-top:40px;">
      <button onclick="location.href='index.html'">← 受講者画面へ</button>
    </div>
  </aside>

  <main style="flex:1; padding:40px; min-width:0; box-sizing:border-box;">
  <h1>管理者ダッシュボード</h1>
<div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; margin-bottom:32px;">

  <div style="background:#858bc9; color:white; padding:22px; border-radius:10px;">
    <div style="font-size:14px; margin-bottom:10px;">受講者数</div>
    <div style="font-size:30px; font-weight:bold;" id="studentCount">-</div>
  </div>

  <div style="background:#7379b8; color:white; padding:22px; border-radius:10px;">
    <div style="font-size:14px; margin-bottom:10px;">レッスン数</div>
    <div style="font-size:30px; font-weight:bold;">66件</div>
  </div>

  <div style="background:#bf7479; color:white; padding:22px; border-radius:10px;">
    <div style="font-size:14px; margin-bottom:10px;">全体完了率</div>
    <div style="font-size:30px; font-weight:bold;" id="completionRate">-</div>
  </div>

  <div style="background:#b46268; color:white; padding:22px; border-radius:10px;">
    <div style="font-size:14px; margin-bottom:10px;">平均テストスコア</div>
    <div style="font-size:30px; font-weight:bold;" id="averageScore">-</div>
  </div>

</div>
 <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">

  <div style="background:white; padding:20px; border:1px solid #e5e7eb; border-radius:10px;">
    <h3 style="margin-top:0;">学習進捗</h3>
    <div id="learningProgressText" style="color:#6b7280; margin-bottom:12px;">
      完了レッスンを読み込み中...
    </div>
    <div style="height:14px; background:#f0f1f5; border-radius:10px; overflow:hidden;">
      <div id="learningProgressBar"
           style="height:100%; width:0%; background:#858bc9; border-radius:10px;">
      </div>
    </div>
  </div>

  <div style="background:white; padding:20px; border:1px solid #e5e7eb; border-radius:10px;">
    <h3 style="margin-top:0;">テスト実施状況</h3>
    <div id="testProgressText" style="color:#6b7280; margin-bottom:12px;">
      テスト結果を読み込み中...
    </div>
    <div style="height:14px; background:#f0f1f5; border-radius:10px; overflow:hidden;">
      <div id="testProgressBar"
           style="height:100%; width:0%; background:#bd6f74; border-radius:10px;">
      </div>
    </div>
  </div>

</div>
<script>
  const supabaseUrl = "https://xjwmgvvoxunsqdjttpdo.supabase.co";
  const supabaseKey = "sb_publishable_VOQIwc0dAsPP233GHl9Cog_Kle9Ybfd";

  const supabaseClient =
    supabase.createClient(supabaseUrl, supabaseKey);

  async function loadStudents() {

    const { data: profiles, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("user_id, name");

    if (profileError) {
      console.error(profileError);
      return;
    }

    const { data: progress, error: progressError } =
      await supabaseClient
        .from("learning_progress")
        .select("user_id, course_id, lesson_id, completed")
        .eq("completed", true);

    if (progressError) {
      console.error(progressError);
      return;
    }
const { data: testResults, error: testResultsError } =
  await supabaseClient
    .from("test_results")
    .select("user_id, course_id, lesson_index, score, total_questions, percent, passed");

if (testResultsError) {
  console.error(testResultsError);
  return;
}
const studentCount = profiles.length;
const completedLessons = progress.length;
const totalLessons = 66 * studentCount;

const completionRate =
  totalLessons > 0
    ? Math.round((completedLessons / totalLessons) * 100)
    : 0;

document.getElementById("studentCount").textContent =
  `${studentCount}人`;

document.getElementById("completionRate").textContent =
  `${completionRate}%`;

document.getElementById("learningProgressText").textContent =
  `完了レッスン: ${completedLessons}件 / 全体: ${totalLessons}件`;

document.getElementById("learningProgressBar").style.width =
  `${completionRate}%`;
   const averageScore =
  testResults.length > 0
    ? Math.round(
        testResults.reduce((sum, result) => sum + result.percent, 0) /
          testResults.length
      )
    : 0;
    document.getElementById("averageScore").textContent =
  `${averageScore}点`;
    const passedTests = testResults.filter(result => result.passed).length;
const totalTests = 66 * studentCount;

const testCompletionRate =
  totalTests > 0
    ? Math.round((passedTests / totalTests) * 100)
    : 0;

document.getElementById("testProgressText").textContent =
  `合格テスト：${passedTests}件 / 全体：${totalTests}件（${testCompletionRate}%）`;

document.getElementById("testProgressBar").style.width =
  `${testCompletionRate}%`;
  }

async function checkAdminAndLoad() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("ログインしてください");
    window.location.href = "index.html";
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("user_id", user.id)
    .single();

  if (error || !profile || profile.role !== "admin") {
    alert("管理者のみアクセスできます");
    window.location.href = "index.html";
    return;
  }

  loadStudents();
}

checkAdminAndLoad();
</script>
    </main>
</div>
</body>
</html>
