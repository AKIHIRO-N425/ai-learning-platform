<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習進捗 管理画面</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  body {
    margin: 0;
    font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f4f7fb;
    color: #1f2937;
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 28px;
    color: #0f172a;
  }

  table {
    width: 100%;
    max-width: 760px;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
  }

  th,
  td {
    padding: 16px 18px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
  }

  th {
    background: #2563eb;
    color: white;
    font-weight: bold;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover td {
    background: #f8fafc;
  }
</style>
</head>

<body>

  <h1>学習進捗 管理画面</h1>

  <table border="1" cellpadding="10">
    <thead>
      <tr>
        <th>受講者名</th>
        <th>完了数</th>
        <th>進捗率</th>
      </tr>
    </thead>

    <tbody id="studentList">
      <tr>
        <td colspan="3">読み込み中...</td>
      </tr>
    </tbody>
  </table>
<script>
  const supabaseUrl = "https://xjwmgvvoxunsqdjttpdo.supabase.co";
  const supabaseKey = "sb_publishable_VOQIwc0dAsPP233GHl9Cog_Kle9Ybfd";

  const supabaseClient =
    supabase.createClient(supabaseUrl, supabaseKey);

  async function loadStudents() {

    const { data: profiles, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("user_id, name");

    if (profileError) {
      console.error(profileError);
      return;
    }

    const { data: progress, error: progressError } =
      await supabaseClient
        .from("learning_progress")
        .select("user_id, lesson_id, completed")
        .eq("completed", true);

    if (progressError) {
      console.error(progressError);
      return;
    }

    const studentList = document.getElementById("studentList");
    studentList.innerHTML = "";

    profiles.forEach(profile => {

      const completedLessons =
        progress.filter(item =>
          item.user_id === profile.user_id
        ).length;

      const totalLessons = 3;

      const percent =
        Math.round((completedLessons / totalLessons) * 100);

      studentList.innerHTML += `
        <tr>
          <td>${profile.name || "名前未設定"}</td>
          <td>${completedLessons} / ${totalLessons}</td>
          <td>${percent}%</td>
        </tr>
      `;
    });
  }

async function checkAdminAndLoad() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("ログインしてください");
    window.location.href = "index.html";
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("user_id", user.id)
    .single();

  if (error || !profile || profile.role !== "admin") {
    alert("管理者のみアクセスできます");
    window.location.href = "index.html";
    return;
  }

  loadStudents();
}

checkAdminAndLoad();
</script>
</body>
</html>
